name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the final v1.x release: action v6 only supports the
          # v1 golangci-lint CLI/config schema (matching .golangci.yml
          # here), and a future bump of golangci-lint-action to v7+ would
          # start resolving "latest" to a v2 binary that rejects this
          # config. Pinning makes the v1-action/v1-config pairing explicit.
          version: v1.64.8
